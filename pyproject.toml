[project]
name = "relkit"
version = "0.1.0"
description = "Segment-aware search relevance measurement with LLM judges"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "numpy>=1.22"]
license = {text = "MIT"}

[project.scripts]
relkit = "relkit.cli:main"

[tool.setuptools]
packages = ["relkit", "relkit.adapters", "relkit.judges"]
